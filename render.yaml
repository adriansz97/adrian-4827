services:
  - type: web
    name: snail-gp-adrian-4827-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build -w @snail-gp/contracts && npm run build -w @snail-gp/api
    startCommand: npm run start -w @snail-gp/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: WEB_ORIGIN
        value: https://snail-gp-adrian-4827.onrender.com
      - key: SNAILPAY_TIMEOUT_DELAY_MS
        value: 5500
    buildFilter:
      paths:
        - apps/api/**
        - packages/contracts/**
        - package.json
        - package-lock.json

  - type: web
    name: snail-gp-adrian-4827
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build -w @snail-gp/contracts && npm run build -w @snail-gp/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        value: https://snail-gp-adrian-4827-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - apps/web/**
        - packages/contracts/**
        - package.json
        - package-lock.json
